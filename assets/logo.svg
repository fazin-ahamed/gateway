<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t d">
  <title id="t">Wind gateway</title>
  <desc id="d">Three wind strokes on a rounded sky tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fb0ff"/>
      <stop offset="0.55" stop-color="#2f8ef0"/>
      <stop offset="1" stop-color="#1d63d8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b3aa0" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#soft)">
    <rect x="24" y="24" width="208" height="208" rx="56" fill="url(#tile)"/>
  </g>
  <rect x="24" y="24" width="208" height="208" rx="56" fill="url(#sheen)"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="20">
    <path d="M64 92h78a26 26 0 1 0-26-26"/>
    <path d="M56 136h114a30 30 0 1 1-30 30"/>
    <path d="M84 180h52"/>
  </g>
</svg>
